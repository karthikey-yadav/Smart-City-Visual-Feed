version: "3.9"

services:
  backend:
    build: ./backend
    container_name: quality-gatekeeper-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - MODEL_PATH=/app/quality_model_best.pt
      - DB_PATH=/app/data/quality_results.db
      - DEVICE=cpu
      - MAX_UPLOAD_MB=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quality-gatekeeper-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
